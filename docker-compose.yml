version: "3.9"

services:
  gateway:
    image: krakend/krakend:2.7
    container_name: gateway
    volumes:
      - ./gateway:/etc/krakend
    command: ["run", "-c", "/etc/krakend/krakend.json"]
    ports:
      - "8080:8080"
    depends_on:
      - keycloak
      - user-service
      - account-service
      - transfer-service

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: ["start-dev", "--http-port=8080"]
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    ports:
      - "8082:8080"

  user-service:
    image: ealen/echo-server:latest

  transfer-service:
    image: ealen/echo-server:latest

  account-service:
    image: ealen/echo-server:latest