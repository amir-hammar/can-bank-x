version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      POSTGRES_MULTIPLE_DATABASES: canbankx_user,canbankx_account,canbankx_transfer
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - can-bank-x-network

  gateway:
    image: krakend/krakend:2.7
    container_name: gateway
    volumes:
      - ./gateway:/etc/krakend
    command: ["run", "-c", "/etc/krakend/krakend.json"]
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - keycloak
      - user-service
      - account-service
      - transfer-service
    networks:
      - can-bank-x-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: ["start-dev", "--http-port=8080", "--import-realm"]
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    ports:
      - "8082:8080"
    volumes:
      - ./infra/keycloak/realm-can-bank-x.json:/opt/keycloak/data/import/realm-can-bank-x.json:ro
    networks:
      - can-bank-x-network

  user-service:
    build:
      context: ./services/user-services
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${USER_SERVICE_DATABASE_URL}
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - can-bank-x-network

  transfer-service:
    image: ealen/echo-server:latest
    env_file:
      - .env
    environment:
      DATABASE_URL: ${TRANSFER_SERVICE_DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - can-bank-x-network

  account-service:
    image: ealen/echo-server:latest
    env_file:
      - .env
    environment:
      DATABASE_URL: ${ACCOUNT_SERVICE_DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - can-bank-x-network

volumes:
  postgres-data:

networks:
  can-bank-x-network:
    name: can-bank-x-network
    external: true