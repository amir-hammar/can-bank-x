[package]
name = "account-service"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "=0.7.9"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "net"] }
sqlx = { version = "=0.8.2", features = ["runtime-tokio-native-tls", "postgres", "uuid", "migrate"] }
uuid = { version = "=1.12.1", features = ["v4", "serde"] }
redis = { version = "=0.25.4", features = ["aio", "tokio-comp", "connection-manager"] }
log = "=0.4.21"
async-trait = "=0.1.81"

[dev-dependencies]
http-body-util = "=0.1.3"
tower = { version = "=0.5.2", features = ["util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
