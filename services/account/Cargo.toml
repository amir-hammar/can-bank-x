[package]
name = "account-service"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "=0.7.9"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "net"] }

[dev-dependencies]
http-body-util = "=0.1.3"
tower = { version = "=0.5.2", features = ["util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
