[package]
name = "transfer-service"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "=0.7.9"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "net"] }
reqwest = { version = "=0.12.24", default-features = false, features = ["json", "rustls-tls"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate", "macros"] }
uuid = { version = "=1.18.1", features = ["v4", "serde"] }
redis = { version = "=0.25.4", features = ["aio", "tokio-comp", "connection-manager"] }
log = "=0.4.21"
async-trait = "=0.1.81"

[profile.release]
lto = true
codegen-units = 1
strip = true
