[package]
name = "user-service"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "=0.7.9"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "net"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "macros"] }
uuid = { version = "=1.18.1", features = ["v4", "serde"] }
chrono = { version = "=0.4.42", features = ["serde"] }
regex = "=1.11.1"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
tower = "=0.5.2"
http-body-util = "=0.1.3"
