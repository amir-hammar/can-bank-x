global:
  scrape_interval: 15s

scrape_configs:
  - job_name: user-service
    static_configs:
      - targets: ["user-service:8080"]
    metrics_path: /metrics

  - job_name: account-service
    static_configs:
      - targets: ["account-service:8080"]
    metrics_path: /metrics

  - job_name: transfer-service
    static_configs:
      - targets: ["transfer-service:8080"]
    metrics_path: /metrics

  - job_name: api-gateway-health
    static_configs:
      - targets: ["api-gateway:8080"]
    metrics_path: /__health
