openapi: 3.0.3
info:
  title: can-bank-x user-service API
  version: 1.0.0
servers:
  - url: http://localhost:8080
paths:
  /api/v1/auth/me:
    get:
      summary: Get authenticated principal summary
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated principal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /api/v1/customers/me:
    get:
      summary: Get customer profile by JWT subject
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Customer profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerMeResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/customers/register:
    post:
      summary: Register customer and start KYC countdown
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Customer registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
        '409':
          description: Customer already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /api/v1/customers/by-username:
    get:
      summary: Get customer by username (used for transfer beneficiary resolution)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: username
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Customer found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerByUsernameResponse'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /api/v1/kyc/submit:
    post:
      summary: Create or return pending KYC case
      security:
        - bearerAuth: []
      responses:
        '202':
          description: KYC submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycSubmitResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/kyc/confirm:
    post:
      summary: Confirm KYC review decision
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approved]
              properties:
                approved:
                  type: boolean
      responses:
        '200':
          description: KYC state updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycStatusResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/kyc/status:
    get:
      summary: Get KYC case status for current customer
      security:
        - bearerAuth: []
      responses:
        '200':
          description: KYC status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycStatusResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AuthMeResponse:
      type: object
      required: [sub, roles]
      properties:
        sub:
          type: string
        email:
          type: string
          nullable: true
        roles:
          type: array
          items:
            type: string
    CustomerMeResponse:
      type: object
      required:
        [customer_id, username, email, status, kyc_status, kyc_decision_available_in_seconds, full_name, street, city, province, postal_code, country, nas_masked]
      properties:
        customer_id:
          type: string
        username:
          type: string
        email:
          type: string
        status:
          type: string
        kyc_status:
          type: string
        kyc_approved:
          type: boolean
          nullable: true
        kyc_decision_available_in_seconds:
          type: integer
          format: int64
        full_name:
          type: string
        street:
          type: string
        city:
          type: string
        province:
          type: string
        postal_code:
          type: string
        country:
          type: string
        nas_masked:
          type: string
    KycSubmitResponse:
      type: object
      required: [status, kyc_case_id]
      properties:
        status:
          type: string
        kyc_case_id:
          type: string
    KycStatusResponse:
      type: object
      required: [customer_id, kyc_case_id, status, decision_available_in_seconds]
      properties:
        customer_id:
          type: string
        kyc_case_id:
          type: string
        status:
          type: string
        approved:
          type: boolean
          nullable: true
        decision_available_in_seconds:
          type: integer
          format: int64
    CustomerByUsernameResponse:
      type: object
      properties:
        id:
          type: string
          description: Customer UUID
    ErrorResponse:
      type: object
      required: [code, message, details, traceId]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string
        traceId:
          type: string
