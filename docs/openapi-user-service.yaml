openapi: 3.0.3
info:
  title: can-bank-x user-service API
  version: 1.0.0
servers:
  - url: http://localhost:8080
paths:
  /api/v1/auth/me:
    get:
      summary: Get authenticated principal summary
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated principal
        '401':
          description: Unauthorized
  /api/v1/customers/register:
    post:
      summary: Register customer profile using JWT subject
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, full_name, street, city, province, postal_code, country, nas]
              properties:
                email: { type: string, format: email }
                full_name: { type: string }
                street: { type: string }
                city: { type: string }
                province: { type: string }
                postal_code: { type: string }
                country: { type: string }
                nas: { type: string }
      responses:
        '201':
          description: Registered
        '400':
          description: Validation error
        '409':
          description: Duplicate customer
  /api/v1/customers/me:
    get:
      summary: Get customer profile by JWT subject
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Customer profile
        '404':
          description: Not found
  /api/v1/kyc/submit:
    post:
      summary: Create or return pending KYC case
      security:
        - bearerAuth: []
      responses:
        '202':
          description: KYC submitted
  /api/v1/kyc/confirm:
    post:
      summary: Confirm KYC review decision
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approved]
              properties:
                approved:
                  type: boolean
      responses:
        '200':
          description: KYC state updated
  /api/v1/kyc/status:
    get:
      summary: Get KYC case status for current customer
      security:
        - bearerAuth: []
      responses:
        '200':
          description: KYC status
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
