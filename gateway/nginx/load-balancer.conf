worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # Docker DNS so NGINX can resolve service tasks for scaled containers.
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream api_gateway_upstream {
    zone api_gateway_upstream 64k;
    least_conn;
    server api-gateway:8080 resolve max_fails=3 fail_timeout=10s;
    keepalive 64;
  }

  server {
    listen 8080;

    location / {
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
      proxy_next_upstream_tries 3;
      proxy_connect_timeout 2s;
      proxy_read_timeout 15s;
      proxy_send_timeout 15s;
      proxy_pass http://api_gateway_upstream;
    }
  }
}
