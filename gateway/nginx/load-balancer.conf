worker_processes auto;

events {
  worker_connections 1024;
}

http {
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream user_upstream {
    zone user_upstream 64k;
    least_conn;
    server user-service:8080 resolve max_fails=3 fail_timeout=10s;
    keepalive 64;
  }

  upstream account_upstream {
    zone account_upstream 64k;
    least_conn;
    server account-service:8080 resolve max_fails=3 fail_timeout=10s;
    keepalive 64;
  }

  upstream transfer_upstream {
    zone transfer_upstream 64k;
    least_conn;
    server transfer-service:8080 resolve max_fails=3 fail_timeout=10s;
    keepalive 64;
  }

  server {
    listen 8080;

    location ~ ^/api/v1/(customers|auth|kyc)/ {
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
      proxy_next_upstream_tries 3;
      proxy_connect_timeout 2s;
      proxy_read_timeout 15s;
      proxy_send_timeout 15s;
      proxy_pass http://user_upstream;
    }

    location ~ ^/api/v1/accounts/ {
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
      proxy_next_upstream_tries 3;
      proxy_connect_timeout 2s;
      proxy_read_timeout 15s;
      proxy_send_timeout 15s;
      proxy_pass http://account_upstream;
    }

    location ~ ^/api/v1/transfers/ {
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
      proxy_next_upstream_tries 3;
      proxy_connect_timeout 2s;
      proxy_read_timeout 15s;
      proxy_send_timeout 15s;
      proxy_pass http://transfer_upstream;
    }

    location / {
      return 404;
    }
  }
}
